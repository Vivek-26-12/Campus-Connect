<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 850" width="1150" height="850" style="background:#0b1120; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="atlasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13aa52" />
      <stop offset="100%" stop-color="#00684a" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <rect x="40" y="25" width="1070" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="58" fill="#f8fafc" font-size="20" font-weight="bold">Lab 7: API Gateway, Configuration-Based Service Discovery &amp; Cloud Deployment</text>
  <text x="70" y="80" fill="#94a3b8" font-size="13">Single Public Entry Point • Isolated Private Docker Network • Centralized 502/504 Handling • MongoDB Atlas</text>

  <!-- Layer 1: Client / Postman (Internet) -->
  <g transform="translate(60, 130)">
    <rect width="260" height="90" rx="10" fill="url(#clientGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
    <text x="130" y="38" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Client Layer (Internet)</text>
    <text x="130" y="60" fill="#dbeafe" font-size="13" text-anchor="middle">Postman / Mobile / Web App</text>
    <text x="130" y="78" fill="#93c5fd" font-size="11" text-anchor="middle">Sends requests to single public URL</text>
  </g>

  <!-- Public Internet Request Arrow -->
  <path d="M 320 175 L 430 175" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="375" y="165" fill="#38bdf8" font-size="11" text-anchor="middle">Public Traffic</text>
  <text x="375" y="195" fill="#94a3b8" font-size="10" text-anchor="middle">HTTP :3000 / HTTPS</text>

  <!-- Layer 2: API Gateway (Cloud Hosted / Publicly Reachable) -->
  <g transform="translate(440, 120)">
    <rect width="660" height="110" rx="10" fill="url(#gwGrad)" stroke="#c084fc" stroke-width="2" />
    <text x="330" y="35" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">API Gateway (Public Entry Point - Port 3000 / Cloud URL)</text>
    <text x="330" y="58" fill="#e9d5ff" font-size="13" text-anchor="middle">Reverse Proxy • Centralized 502/504 Handling • Request &amp; Response Latency Logging</text>
    <text x="330" y="78" fill="#f3e8ff" font-size="12" text-anchor="middle">Service Discovery Registry: { USER_SERVICE_URL, PRODUCT_SERVICE_URL, ORDER_SERVICE_URL }</text>
    <text x="330" y="98" fill="#d8b4fe" font-size="11" text-anchor="middle">Exposed Endpoints: GET /health | GET /services | /users/* | /products/* | /orders/*</text>
  </g>

  <!-- Docker Network Boundary Box (Private Microservices Layer) -->
  <rect x="40" y="270" width="1070" height="340" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8,5" />
  <rect x="60" y="258" width="360" height="26" rx="6" fill="#0369a1" />
  <text x="240" y="276" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">🔒 PRIVATE DOCKER NETWORK: campus-network (Host Ports Blocked)</text>

  <!-- Gateway Routes into Microservices -->
  <!-- Line 1 to User Service -->
  <path d="M 520 230 L 520 310 L 220 310 L 220 340" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="320" y="302" fill="#c084fc" font-size="11">Route /users/*</text>

  <!-- Line 2 to Product Service -->
  <path d="M 770 230 L 770 340" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="780" y="302" fill="#c084fc" font-size="11">Route /products/*</text>

  <!-- Line 3 to Order Service -->
  <path d="M 1000 230 L 1000 340" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="930" y="302" fill="#c084fc" font-size="11">Route /orders/*</text>

  <!-- Microservice 1: User Service -->
  <g transform="translate(80, 340)">
    <rect width="280" height="150" rx="10" fill="url(#userGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="30" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">User Service (:3001)</text>
    <text x="140" y="52" fill="#e0f2fe" font-size="12" text-anchor="middle">Hostname: user-service</text>
    <text x="140" y="72" fill="#bae6fd" font-size="11" text-anchor="middle">Reachable FROM: Docker Network Only</text>
    <rect x="20" y="85" width="240" height="50" rx="6" fill="#083344" />
    <text x="140" y="105" fill="#7dd3fc" font-size="11" text-anchor="middle">GET/POST/PUT/DELETE /users</text>
    <text x="140" y="122" fill="#38bdf8" font-size="10" text-anchor="middle">GET /health (Status UP)</text>
  </g>

  <!-- Microservice 2: Product Service -->
  <g transform="translate(435, 340)">
    <rect width="280" height="150" rx="10" fill="url(#prodGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="140" y="30" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Product Service (:3002)</text>
    <text x="140" y="52" fill="#ecfdf5" font-size="12" text-anchor="middle">Hostname: product-service</text>
    <text x="140" y="72" fill="#a7f3d0" font-size="11" text-anchor="middle">Reachable FROM: Docker Network Only</text>
    <rect x="20" y="85" width="240" height="50" rx="6" fill="#064e3b" />
    <text x="140" y="105" fill="#6ee7b7" font-size="11" text-anchor="middle">GET/POST/PUT/DELETE /products</text>
    <text x="140" y="122" fill="#34d399" font-size="10" text-anchor="middle">GET /health (Status UP)</text>
  </g>

  <!-- Microservice 3: Order Service -->
  <g transform="translate(790, 340)">
    <rect width="280" height="150" rx="10" fill="url(#orderGrad)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="140" y="30" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Order Service (:3003)</text>
    <text x="140" y="52" fill="#fffbeb" font-size="12" text-anchor="middle">Hostname: order-service</text>
    <text x="140" y="72" fill="#fde68a" font-size="11" text-anchor="middle">Reachable FROM: Docker Network Only</text>
    <rect x="20" y="85" width="240" height="50" rx="6" fill="#78350f" />
    <text x="140" y="105" fill="#fcd34d" font-size="11" text-anchor="middle">GET/POST /orders</text>
    <text x="140" y="122" fill="#fbbf24" font-size="10" text-anchor="middle">Inter-Service Orchestrator</text>
  </g>

  <!-- Inter-service arrows: Order -> User, Order -> Product -->
  <path d="M 850 490 L 850 540 L 220 540 L 220 490" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="500" y="533" fill="#38bdf8" font-size="11" text-anchor="middle">REST Call: GET http://user-service:3001/users/:id</text>

  <path d="M 910 490 L 910 570 L 575 570 L 575 490" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-green)" />
  <text x="740" y="563" fill="#34d399" font-size="11" text-anchor="middle">REST Call: GET http://product-service:3002/products/:id</text>

  <!-- Layer 4: MongoDB Atlas / Persistent Storage -->
  <!-- Arrows from microservices to Cloud Database -->
  <path d="M 220 580 L 220 670" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <path d="M 575 580 L 575 670" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <path d="M 930 580 L 930 670" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <g transform="translate(140, 675)">
    <rect width="870" height="120" rx="14" fill="url(#atlasGrad)" stroke="#34d399" stroke-width="2" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.4))" />
    <text x="435" y="38" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">☁️ MongoDB Atlas Cloud Database Cluster</text>
    <text x="435" y="64" fill="#d1fae5" font-size="13" text-anchor="middle">Persistent Cloud Storage • Connection via MONGODB_URI • Dual Persistence Fallback</text>
    <rect x="40" y="78" width="240" height="28" rx="6" fill="#022c22" />
    <text x="160" y="96" fill="#6ee7b7" font-size="11" text-anchor="middle">users_db.users</text>
    <rect x="315" y="78" width="240" height="28" rx="6" fill="#022c22" />
    <text x="435" y="96" fill="#6ee7b7" font-size="11" text-anchor="middle">products_db.products</text>
    <rect x="590" y="78" width="240" height="28" rx="6" fill="#022c22" />
    <text x="710" y="96" fill="#6ee7b7" font-size="11" text-anchor="middle">orders_db.orders</text>
  </g>
</svg>
