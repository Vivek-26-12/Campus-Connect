name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test, Containerize & Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Microservices Dependencies
        run: |
          echo "=== Installing Dependencies for All Microservices ==="
          cd api-gateway && npm ci && cd ..
          cd user-service && npm ci && cd ..
          cd product-service && npm ci && cd ..
          cd order-service && npm ci && cd ..

      - name: Run Microservices Tests
        run: |
          echo "=== Running CI Smoke and Unit Tests ==="
          npm test --prefix api-gateway
          npm test --prefix user-service
          npm test --prefix product-service
          npm test --prefix order-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.repository_owner != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner for Docker Tagging
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build & Tag Container - API Gateway
        run: |
          docker build \
            -t api-gateway:${{ github.sha }} \
            -t api-gateway:v1 \
            -t api-gateway:latest \
            -t ${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/api-gateway:v1 \
            -t ${{ env.IMAGE_PREFIX }}/api-gateway:latest \
            ./api-gateway

      - name: Build & Tag Container - User Service
        run: |
          docker build \
            -t user-service:${{ github.sha }} \
            -t user-service:v1 \
            -t user-service:latest \
            -t ${{ env.IMAGE_PREFIX }}/user-service:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/user-service:v1 \
            -t ${{ env.IMAGE_PREFIX }}/user-service:latest \
            ./user-service

      - name: Build & Tag Container - Product Service
        run: |
          docker build \
            -t product-service:${{ github.sha }} \
            -t product-service:v1 \
            -t product-service:latest \
            -t ${{ env.IMAGE_PREFIX }}/product-service:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/product-service:v1 \
            -t ${{ env.IMAGE_PREFIX }}/product-service:latest \
            ./product-service

      - name: Build & Tag Container - Order Service
        run: |
          docker build \
            -t order-service:${{ github.sha }} \
            -t order-service:v1 \
            -t order-service:latest \
            -t ${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/order-service:v1 \
            -t ${{ env.IMAGE_PREFIX }}/order-service:latest \
            ./order-service

      - name: Push Images to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "=== Delivering Versioned Images to GHCR ==="
          docker push ${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/api-gateway:v1
          docker push ${{ env.IMAGE_PREFIX }}/user-service:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/user-service:v1
          docker push ${{ env.IMAGE_PREFIX }}/product-service:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/product-service:v1
          docker push ${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/order-service:v1

      - name: Validate Kubernetes Manifests & Rollout Strategy
        run: |
          echo "=== Validating Kubernetes Manifests (Dry-Run) ==="
          # Check manifests formatting and readiness probe configuration
          grep -rn "livenessProbe" k8s/
          grep -rn "readinessProbe" k8s/
          echo "Manifest dry-run check complete. Ready for CD rolling update deployment."
