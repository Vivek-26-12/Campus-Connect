apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lab8
  labels:
    app: api-gateway
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: frontend
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: GATEWAY_PORT
        - name: GATEWAY_PORT
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: GATEWAY_PORT
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: USER_SERVICE_URL
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: PRODUCT_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: ORDER_SERVICE_URL
        - name: REQUEST_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: REQUEST_TIMEOUT_MS
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: campus-config
              key: NODE_ENV
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
